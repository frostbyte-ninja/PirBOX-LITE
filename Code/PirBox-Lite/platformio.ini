; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[base]
build_flags = --std=c++17 -DETL_NO_STL=1
lib_deps =
  https://github.com/ETLCPP/etl-arduino.git#20.40.0
  suculent/AESLib@^2.3.6
platform_packages = platformio/tool-clangtidy@^1.190100.0
check_tool = clangtidy
check_flags = clangtidy: --format-style=file --config-file=.clang-tidy
check_src_filters =
  +<src/*>
  -<lib/>
  +<lib/aes/*>
  +<lib/arduino_hal/*>
  +<lib/sx126x/*>

[env:ATtiny1616]
extends = base
platform = atmelmegaavr
framework = arduino
board = ATtiny1616
upload_speed = 230400
upload_flags =
  --tool
  uart
  --device
  attiny1616
  --uart
  $UPLOAD_PORT
  --clk
  $UPLOAD_SPEED
upload_command = pymcuprog write --erase $UPLOAD_FLAGS --filename $SOURCE

[env:native]
extends = base
platform = native
test_framework = googletest
debug_test = *
